<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier Textmoji Studio</title>
    <style>
        :root {
            --accent: #00d4ff;
            --bg: #0f0f0f;
            --panel: #1a1a1a;
        }
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: #efefef; 
            margin: 0; 
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: var(--panel);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { margin-top: 0; font-weight: 800; letter-spacing: -1px; color: var(--accent); }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #252525;
            border-radius: 12px;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; text-align: left; }
        label { font-size: 0.85rem; color: #aaa; font-weight: 600; }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--accent);
            color: #000;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button.secondary { background: #444; color: white; margin-left: 10px; }

        #display-area {
            background: #000;
            border-radius: 12px;
            padding: 20px;
            min-height: 300px;
            overflow-x: auto;
            border: 1px solid #333;
            position: relative;
        }
        #output {
            font-family: 'Courier New', Courier, monospace;
            white-space: pre;
            font-size: 10px;
            line-height: 10px;
            display: inline-block;
            text-align: left;
        }
        .braille-mode #output {
            line-height: normal;
            letter-spacing: 1px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Textmoji Generator</h1>
    
    <div class="controls">
        <div class="control-group">
            <label>Source Image</label>
            <input type="file" id="upload" accept="image/*">
        </div>
        <div class="control-group">
            <label>Render Mode</label>
            <select id="mode">
                <option value="color">Full Color ASCII</option>
                <option value="braille">Braille (Dots)</option>
            </select>
        </div>
        <div class="control-group">
            <label>Resolution (Width)</label>
            <input type="range" id="res" min="50" max="200" value="100">
        </div>
        <div class="control-group" id="threshold-wrap" style="display:none;">
            <label>Dot Sensitivity</label>
            <input type="range" id="threshold" min="0" max="255" value="128">
        </div>
    </div>

    <div style="margin-bottom: 20px;">
        <button id="copyBtn">Copy to Clipboard</button>
        <button id="downloadBtn" class="secondary">Export as PNG</button>
    </div>

    <div id="display-area">
        <div id="output">Upload an image to begin...</div>
    </div>
</div>

<script>
    const upload = document.getElementById('upload');
    const resInput = document.getElementById('res');
    const modeInput = document.getElementById('mode');
    const thresholdInput = document.getElementById('threshold');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    
    const charset = "$@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/\\|()1{}[]?-_+~<>i!lI;:,\"^`'. ";
    let rawText = "";

    function update() {
        const file = upload.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => render(img);
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function render(img) {
        const w = parseInt(resInput.value);
        const mode = modeInput.value;
        document.body.className = mode + "-mode";
        document.getElementById('threshold-wrap').style.display = mode === 'braille' ? 'flex' : 'none';

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        // Braille uses 2x4 chunks, ASCII uses 1x1
        const scaleY = mode === 'braille' ? (img.height / img.width) * w : (img.height / img.width) * w * 0.5;
        canvas.width = w;
        canvas.height = scaleY;
        ctx.drawImage(img, 0, 0, w, scaleY);
        const p = ctx.getImageData(0, 0, w, scaleY).data;

        if (mode === 'color') {
            let html = "";
            rawText = "";
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < w; x++) {
                    const i = (y * w + x) * 4;
                    const b = (0.2126 * p[i] + 0.7152 * p[i+1] + 0.0722 * p[i+2]);
                    const char = charset[Math.floor((b / 255) * (charset.length - 1))];
                    rawText += char;
                    html += `<span style="color:rgb(${p[i]},${p[i+1]},${p[i+2]})">${char === ' ' ? '&nbsp;' : char}</span>`;
                }
                html += "<br>";
                rawText += "\n";
            }
            output.innerHTML = html;
        } else {
            // Braille Logic
            let braille = "";
            const thresh = parseInt(thresholdInput.value);
            for (let y = 0; y < canvas.height; y += 4) {
                for (let x = 0; x < w; x += 2) {
                    let code = 0;
                    const dots = [[0,0,1],[0,1,2],[0,2,4],[1,0,8],[1,1,16],[1,2,32],[0,3,64],[1,3,128]];
                    dots.forEach(([dx, dy, bit]) => {
                        const pi = ((y + dy) * w + (x + dx)) * 4;
                        if (p[pi] !== undefined && (p[pi]+p[pi+1]+p[pi+2])/3 > thresh) code |= bit;
                    });
                    braille += String.fromCharCode(0x2800 + code);
                }
                braille += "\n";
            }
            rawText = braille;
            output.textContent = braille;
        }
    }

    copyBtn.onclick = () => {
        navigator.clipboard.writeText(rawText);
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "Copied!";
        setTimeout(() => copyBtn.innerText = originalText, 2000);
    };

    [upload, resInput, modeInput, thresholdInput].forEach(el => el.onchange = update);
    resInput.oninput = update;
    thresholdInput.oninput = update;
</script>
</body>
</html>
